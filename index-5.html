<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EarthMinute.net | Hello Future World</title>
  <meta name="description" content="EarthMinute.net. Part of the Q2 movement.">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cloudflare Turnstile (human check) -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    :focus-visible { outline: 2px solid #34d399; outline-offset: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center px-6 py-10 text-center">

  <main class="max-w-xl">
    <h1 class="text-4xl sm:text-6xl font-bold tracking-tight">Hello Future World.</h1>

    <p class="mt-6 font-mono text-emerald-400 text-lg">EarthMinute.net</p>
    <p class="mt-2 text-slate-400">Part of the Q2 movement.</p>

    <p class="mt-14 text-sm text-slate-500">Copyright 2025 &ndash; 2050. All Rights Reserved.</p>

    <p class="mt-2 text-sm text-slate-300">
      Read the
      <!-- EDIT 1: replace https://example.com/terms with your real Terms and Conditions URL -->
      <a href="https://example.com/terms" target="_blank" rel="noopener noreferrer"
         class="text-emerald-400 underline underline-offset-4 hover:text-emerald-300">Terms and Conditions</a>
      to continue.
    </p>

    <!-- Human check: replace data-sitekey with your own Turnstile site key (EDIT 2).
         The key below is Cloudflare's public TEST key and always passes. -->
    <div class="mt-8 flex justify-center">
      <div class="cf-turnstile"
           data-sitekey="1x00000000000000000000AA"
           data-theme="dark"
           data-callback="onHumanVerified"
           data-expired-callback="onHumanExpired"></div>
    </div>

    <!-- EDIT 3: replace the href below with the page visitors go to next -->
    <a id="continue" href="https://example.com/continue" aria-disabled="true" tabindex="-1"
       class="inline-block mt-6 px-5 py-2.5 rounded-lg bg-emerald-500 text-slate-950 font-semibold text-sm transition-colors opacity-40 pointer-events-none">
      Accept &amp; Continue
    </a>
    <p id="hint" class="mt-3 text-xs text-slate-500">Complete the check above to continue.</p>
  </main>

  <script>
    const btn = document.getElementById('continue');
    const hint = document.getElementById('hint');
    function onHumanVerified() {
      btn.classList.remove('opacity-40', 'pointer-events-none');
      btn.classList.add('hover:bg-emerald-400');
      btn.removeAttribute('aria-disabled');
      btn.removeAttribute('tabindex');
      hint.classList.add('hidden');
    }
    function onHumanExpired() {
      btn.classList.add('opacity-40', 'pointer-events-none');
      btn.classList.remove('hover:bg-emerald-400');
      btn.setAttribute('aria-disabled', 'true');
      btn.setAttribute('tabindex', '-1');
      hint.classList.remove('hidden');
    }
  </script>
</body>
</html>
